name: upstream sync

# Weekly: sync to upstream pstack main and open (or refresh) a pull request from the
# upstream-sync branch. Needs "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: upstream-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync to upstream main
        run: node tools/sync-upstream.mjs --ref main

      - name: Open or refresh the pull request
        run: |
          pin() { sed -n 's/^- Commit: `\([0-9a-f]*\)`$/\1/p'; }
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')

          # cursor/plugins hosts other plugins too; a new commit that leaves pstack/ alone only moves the pin.
          if [ -z "$(git status --porcelain -- . ':!UPSTREAM.md')" ]; then
            echo "main is in sync with upstream."
            if [ -n "$pr" ]; then gh pr close "$pr" --delete-branch --comment "main is in sync with upstream again."; fi
            exit 0
          fi

          sha=$(pin < UPSTREAM.md)
          version=$(sed -n 's/^- Upstream version: //p' UPSTREAM.md)

          if git fetch --quiet origin "$BRANCH" 2>/dev/null; then
            if [ "$(git show FETCH_HEAD:UPSTREAM.md | pin)" = "$sha" ]; then
              echo "$BRANCH already holds upstream ${sha:0:7}."
              exit 0
            fi
            # More than the bot's one commit means someone fixed things on the branch; never force-push over that.
            if [ -n "$pr" ] && [ "$(git rev-list --count HEAD..FETCH_HEAD)" -gt 1 ]; then
              gh pr comment "$pr" --body "Upstream moved to ${version} (\`${sha}\`). This branch has manual commits, so the workflow left it alone. Run \`node tools/sync-upstream.mjs --ref main\` on the branch to catch up."
              exit 0
            fi
          fi

          set +e
          npm run check > "$RUNNER_TEMP/check.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/check.log"

          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit --quiet -m "chore: sync upstream pstack ${version} (${sha:0:7})"
          git push --force origin "$BRANCH"

          body="$RUNNER_TEMP/body.md"
          {
            echo "Syncs PV Stack to upstream pstack ${version} (\`${sha}\`)."
            echo
            if [ "$status" -eq 0 ]; then
              echo "\`npm run check\` passes."
            else
              echo "\`npm run check\` fails. Upstream likely added a role line, a model slug, or a Cursor reference that the PV Stack layer does not cover yet. Push a fix to \`${BRANCH}\` before merging; the workflow won't overwrite manual commits."
            fi
            echo
            echo '```text'
            git diff --stat HEAD~1 | tail -n 40
            echo
            tail -n 40 "$RUNNER_TEMP/check.log"
            echo '```'
          } > "$body"

          title="chore: sync upstream pstack ${version}"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body"
          fi

          # Pull requests opened with GITHUB_TOKEN don't trigger pull_request workflows; a dispatch does run.
          gh workflow run check.yml --ref "$BRANCH"
